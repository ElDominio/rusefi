meta: config/boards/hellen_mm176_meta.h

pins:
  # --- Ignition Outputs ---
  # S550 PNP: ignition uses INJ driver channels and GP outputs
  - meta: MM176_INJ8
    class: outputs
    ts_name: Ignition 1

  - meta: MM176_INJ6
    class: outputs
    ts_name: Ignition 2

  - meta: MM176_INJ7
    class: outputs
    ts_name: Ignition 3

  - meta: MM176_GP7
    class: outputs
    ts_name: Ignition 4

  - meta: MM176_GP3
    class: outputs
    ts_name: Ignition 5

  - meta: MM176_GP4
    class: outputs
    ts_name: Ignition 6

  - meta: MM176_GP2
    class: outputs
    ts_name: Ignition 7

  - meta: MM176_OUT_IO6
    class: outputs
    ts_name: Ignition 8

  # --- Injector Outputs ---
  # S550 PNP: injectors use IGN driver channels
  - meta: MM176_IGN6
    class: outputs
    ts_name: Injector 1

  - meta: MM176_IGN5
    class: outputs
    ts_name: Injector 2

  - meta: MM176_IGN3
    class: outputs
    ts_name: Injector 3

  - meta: MM176_IGN1
    class: outputs
    ts_name: Injector 4

  - meta: MM176_IGN7
    class: outputs
    ts_name: Injector 5

  - meta: MM176_IGN2
    class: outputs
    ts_name: Injector 6

  - meta: MM176_IGN4
    class: outputs
    ts_name: Injector 7

  - meta: MM176_IGN8
    class: outputs
    ts_name: Injector 8

  # --- VVT Outputs ---
  - meta: MM176_OUT_PWM4
    class: outputs
    ts_name: VVT 1 (Bank1 Exhaust)

  - meta: MM176_OUT_PWM5
    class: outputs
    ts_name: VVT 2 (Bank1 Intake)

  - meta: MM176_OUT_PWM2
    class: outputs
    ts_name: VVT 3 (Bank2 Exhaust)

  - meta: MM176_OUT_PWM3
    class: outputs
    ts_name: VVT 4 (Bank2 Intake)

  # --- Electronic Throttle Body (Dual ETB) ---
  - meta: MM176_OUT_PWM14
    class: outputs
    ts_name: ETB1 PWM

  - meta: MM176_OUT_PWM16
    class: outputs
    ts_name: ETB1 Direction

  - meta: MM176_GP25
    class: outputs
    ts_name: ETB1 Disable

  - meta: MM176_OUT_PWM15
    class: outputs
    ts_name: ETB2 PWM

  - id: E1
    class: outputs
    ts_name: ETB2 Direction

  - id: E0
    class: outputs
    ts_name: ETB2 Disable

  # --- Relay / Low-Side Outputs ---
  - id: C4
    class: outputs
    ts_name: Main Relay

  - meta: MM176_IN_D1
    class: outputs
    ts_name: Fuel Pump Relay

  - meta: MM176_IN_D3
    class: outputs
    ts_name: Fan 1 Relay

  - id: B0
    class: outputs
    ts_name: Fan 2

  - meta: MM176_IN_D2
    class: outputs
    ts_name: AC Clutch Relay

  - meta: MM176_IN_AUX6
    class: outputs
    ts_name: Alternator Control

  - meta: MM176_OUT_PWM9
    class: outputs
    ts_name: Boost Solenoid

  - meta: MM176_INJ5
    class: outputs
    ts_name: Tachometer Output

  - meta: MM176_OUT_IO11
    class: outputs
    ts_name: Purge Solenoid

  - meta: MM176_OUT_IO7
    class: outputs
    ts_name: Cutout Control

  - meta: MM176_OUT_IO8
    class: outputs
    ts_name: Diff Pump Speed

  - meta: MM176_OUT_IO4
    class: outputs
    ts_name: Vent Solenoid

  - meta: MM176_INJ1
    class: outputs
    ts_name: GENLI

  - meta: MM176_IN_CRANK
    class: outputs
    ts_name: Starter Relay

  - id: C5
    class: outputs
    ts_name: IMRC 1

  - id: A7
    class: outputs
    ts_name: IMRC 2

  - meta: MM176_GP6
    class: outputs
    ts_name: DPO 1

  - meta: MM176_INJ4
    class: outputs
    ts_name: DPO 2

  - meta: MM176_GP8
    class: outputs
    ts_name: Fuel FSO / PWR EN

  # --- Analog Inputs (MUX-based via ADC3, PF3-PF10) ---
  # Each channel has two signals: MUX=0 reads "A", MUX=1 reads "B"
  # MUX select pin: PF2 (MM176_GP9)
  - id: EFI_ADC_37
    class: analog_inputs
    ts_name: PPSA / PPSB (MUX PF3)

  - id: EFI_ADC_38
    class: analog_inputs
    ts_name: TPSA / TPSB (MUX PF4)

  - id: EFI_ADC_39
    class: analog_inputs
    ts_name: CLT / IAT (MUX PF5)

  - id: EFI_ADC_32
    class: analog_inputs
    ts_name: IMRC Sensor 1 / 2 (MUX PF6)

  - id: EFI_ADC_33
    class: analog_inputs
    ts_name: Oil Pressure / Fuel Rail Temp (MUX PF7)

  - id: EFI_ADC_34
    class: analog_inputs
    ts_name: Diff Temp / Trans Temp (MUX PF8)

  - id: EFI_ADC_35
    class: analog_inputs
    ts_name: AC Pressure / Fuel Rail Pressure (MUX PF9)

  - id: EFI_ADC_36
    class: analog_inputs
    ts_name: Fuel Tank Pressure / Ambient Air Temp (MUX PF10)

  # --- Analog Inputs (Direct ADC1/ADC2) ---
  - id: EFI_ADC_1
    class: analog_inputs
    ts_name: Knock 1 (PA1)

  - id: EFI_ADC_0
    class: analog_inputs
    ts_name: Knock 2 (PA0)

  - id: EFI_ADC_10
    class: analog_inputs
    ts_name: Onboard MAP Sensor (PC0)

  # --- Event Inputs (Trigger / Cam) ---
  - id: [MM176_GP16, MM176_GP16]
    class: [event_inputs, switch_inputs]
    ts_name: Crankshaft Sensor (PH7, via MAX9924)

  - id: [MM176_OUT_PWM10, MM176_OUT_PWM10]
    class: [event_inputs, switch_inputs]
    ts_name: CAM1 Bank1 Exhaust (PH11, Hall)

  - id: [MM176_OUT_PWM11, MM176_OUT_PWM11]
    class: [event_inputs, switch_inputs]
    ts_name: CAM2 Bank1 Intake (PH10, Hall)

  - id: [MM176_OUT_PWM13, MM176_OUT_PWM13]
    class: [event_inputs, switch_inputs]
    ts_name: CAM3 Bank2 Exhaust (PH6, via MAX9924)

  - id: [MM176_SPI2_MISO, MM176_SPI2_MISO]
    class: [event_inputs, switch_inputs]
    ts_name: CAM4 Bank2 Intake (PB14, via MAX9924)

  - id: [MM176_OUT_PWM12, MM176_OUT_PWM12]
    class: [event_inputs, switch_inputs]
    ts_name: VSS Vehicle Speed (PH9)

  - id: [MM176_GP15, MM176_GP15]
    class: [event_inputs, switch_inputs]
    ts_name: Flex Fuel Sensor (PH8)

  # --- Digital / Switch Inputs ---
  - meta: MM176_IN_AUX5
    class: switch_inputs
    ts_name: Brake Switch 1

  - meta: MM176_GP1
    class: switch_inputs
    ts_name: Brake Switch 2

  - meta: MM176_OUT_PWM6
    class: switch_inputs
    ts_name: Clutch Down Switch

  - meta: MM176_OUT_IO10
    class: switch_inputs
    ts_name: Clutch Up Switch

  - meta: MM176_OUT_IO9
    class: switch_inputs
    ts_name: Oil Level Switch

  - meta: MM176_OUT_IO5
    class: switch_inputs
    ts_name: Start Autostart

  - meta: MM176_OUT_IO1
    class: switch_inputs
    ts_name: Shift Progress

  - meta: MM176_UART2_TX
    class: switch_inputs
    ts_name: Start Request

  - meta: MM176_UART2_RX
    class: switch_inputs
    ts_name: Reverse Switch

  # --- MUX Select ---
  - meta: MM176_GP9
    class: outputs
    ts_name: ADC MUX Select (PF2)

  # --- LEDs ---
  - meta: MM176_LED1_RED
    class: outputs
    ts_name: Comms LED

  - meta: MM176_LED2
    class: outputs
    ts_name: Run LED

  - meta: MM176_LED3
    class: outputs
    ts_name: Warn LED

  - meta: MM176_LED4
    class: outputs
    ts_name: Error LED
